name: DOGE confirmed block whale scanner

on:
  workflow_dispatch:
  # Lean-v1.0: redundant automatic research audit paused; dispatch and dependent triggers retained.

permissions:
  contents: write

concurrency:
  group: doge-whale-block-scanner
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOGE_BLOCK_MAX: '100'
      DOGE_BLOCK_RUN_SECONDS: '600'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify incomplete block resume and coverage boundaries
        run: python -m unittest -v test_whale_block_resume
      - name: Scan confirmed DOGE blocks with checkpoint
        id: scan
        continue-on-error: true
        run: python doge_whale_blocks.py
      - name: Persist diagnostics and checkpoint even on scan errors
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/whales_blocks/latest.json data/whales_blocks/events.csv data/whales_blocks/checkpoint.json data/whales_blocks/pending_block.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          # Persist deletion when a previously incomplete block finishes.
          git add -u -- data/whales_blocks
          if ! git diff --cached --quiet; then
            git commit -m 'data: automatically scan confirmed DOGE blocks'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Fail workflow when scanner failed
        if: steps.scan.outcome != 'success'
        run: exit 1

