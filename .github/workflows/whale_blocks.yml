name: DOGE confirmed block whale scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - 'doge_whale_blocks.py'
      - 'source_publication.py'
      - '.github/workflows/whale_blocks.yml'

permissions:
  contents: write

concurrency:
  group: doge-whale-block-scanner
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOGE_BLOCK_MAX: '100'
      DOGE_BLOCK_RUN_SECONDS: '780'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          sparse-checkout: |
            data/whales_blocks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify incomplete block resume and coverage boundaries
        run: python -m unittest -v test_whale_block_resume
      - name: Scan confirmed DOGE blocks with checkpoint
        id: scan
        continue-on-error: true
        run: python doge_whale_blocks.py
      - name: Publish source files and verify remote bytes
        if: always()
        env:
          SOURCE_COLLECTION_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python source_publication.py --source whale_confirmed_blocks
      - name: Fail workflow when scanner failed
        if: steps.scan.outcome != 'success'
        run: exit 1

      - name: Preserve source failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-5-whales_blocks-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: data/whales_blocks/
