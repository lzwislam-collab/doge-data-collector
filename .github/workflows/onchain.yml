name: Collect DOGE on-chain data

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main]
    paths:
      - 'doge_onchain.py'
      - 'source_publication.py'
      - '.github/workflows/onchain.yml'

permissions:
  contents: write

concurrency:
  group: doge-onchain-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          sparse-checkout: |
            data/onchain
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent DOGE on-chain collector
        id: collector
        continue-on-error: true
        run: python doge_onchain.py
      - name: Publish source files and verify remote bytes
        if: always()
        env:
          SOURCE_COLLECTION_OUTCOME: ${{ steps.collector.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python source_publication.py --source onchain
      - name: Fail if collection was unsuccessful
        if: steps.collector.outcome != 'success'
        run: exit 1
      - name: Preserve source failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-5-onchain-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: data/onchain/
