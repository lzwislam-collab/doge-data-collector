name: Collect DOGE on-chain data

on:
  workflow_dispatch:
  # Lean-v1.0: historical data retained; auto collection paused until prospective incremental value is proven.

permissions:
  contents: write

concurrency:
  group: doge-onchain-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent DOGE on-chain collector
        id: collector
        continue-on-error: true
        run: python doge_onchain.py
      - name: Publish snapshot and diagnostics even if partial
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/onchain/latest.json data/onchain/daily.csv
          if ! git diff --cached --quiet; then
            git commit -m 'data: update DOGE on-chain snapshot'
            git push
          fi
      - name: Fail if collection was unsuccessful
        if: steps.collector.outcome != 'success'
        run: exit 1
