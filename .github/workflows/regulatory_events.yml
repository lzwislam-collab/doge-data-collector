name: Watch official CFTC crypto policy candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'regulatory_events_collector.py'
      - '.github/workflows/regulatory_events.yml'
  schedule:
    - cron: '52 3,15 * * *'
permissions:
  contents: write
concurrency:
  group: doge-regulatory-events
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile regulatory_events_collector.py
      - name: Fetch official CFTC releases
        id: collector
        continue-on-error: true
        run: python regulatory_events_collector.py
      - name: Persist data and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/regulatory_events/events.csv data/regulatory_events/latest.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: archive official CFTC policy candidates'
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Propagate collection failure
        if: steps.collector.outcome != 'success'
        run: exit 1
