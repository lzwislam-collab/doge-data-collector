name: Collect DOGE activity metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '41 1 * * *'

permissions:
  contents: write

concurrency:
  group: doge-onchain-activity
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect DOGE daily activity and transfer buckets
        id: metrics
        continue-on-error: true
        run: python doge_onchain_metrics.py
      - name: Commit snapshots and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/onchain/daily_activity.csv data/onchain/metrics_latest.json data/onchain/transfer_buckets.json; do
            if [ -f "$file" ]; then
              git add -f "$file"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: update DOGE activity and transfer bucket metrics'
            git push
          fi
      - name: Fail on collection error
        if: steps.metrics.outcome != 'success'
        run: exit 1
