name: Audit DOGE feed freshness
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Collect DOGE on-chain data'
      - 'Collect observed DOGE liquidation events'
      - 'Collect DOGE swap liquidity'
      - 'Collect BTC ETH spot ETF flows'
      - 'Collect US macro indicators'
      - 'DOGE confirmed block whale scanner'
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'feed_freshness_audit.py'
      - 'test_feed_quality.py'
      - 'test_enhancement_data.py'
      - '.github/workflows/feed_freshness_audit.yml'
permissions:
  contents: write
concurrency:
  group: doge-feed-freshness-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /data/latest.json
            /data/onchain/latest.json
            /data/onchain/metrics_latest.json
            /data/liquidations/
            /data/liquidity/
            /data/etf/
            /data/macro/
            /data/whales/latest.json
            /data/whales_blocks/latest.json
            /data/okx_address_balances/latest.json
            /data/bybit_liquidations/
            /data/binance_liquidations/
            /data/hourly_research/latest.json
            /data/policy_events/
            /data/regulatory_events/
            /data/sec_events/
            /data/quality/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test source-independent freshness rules
        run: python -m unittest -v test_feed_quality test_enhancement_data
      - name: Check freshness and statuses
        id: check
        continue-on-error: true
        run: python feed_freshness_audit.py
      - name: Publish current source audit and verify remote bytes
        if: always()
        env:
          SOURCE_COLLECTION_OUTCOME: ${{ steps.check.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python source_publication.py --source quality
      - name: Fail if any critical feed failed
        if: steps.check.outcome != 'success'
        run: exit 1
