name: Sample OKX PoR DOGE disclosed address balances
on:
  workflow_dispatch:
  # Lean-v1.0: automatic polling paused; manual dispatch retained.
permissions:
  contents: write
concurrency:
  group: okx-por-doge-address-balances
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BALANCE_BATCH_SIZE: '75'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample balance batch
        id: scan
        continue-on-error: true
        run: python okx_doge_balances.py
      - name: Persist result and errors
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/okx_address_balances/latest.json data/okx_address_balances/checkpoint.json data/okx_address_balances/observations.csv data/okx_address_balances/current_balances.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: sample OKX PoR DOGE address balances'
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$i" = 5 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Fail if scan failed
        if: steps.scan.outcome != 'success'
        run: exit 1
