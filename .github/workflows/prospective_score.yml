name: Score prospective DOGE forecast registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prospective_score.py'
      - '.github/workflows/prospective_score.yml'
  workflow_run:
    workflows: ['Register prospective DOGE baseline forecasts']
    types: [completed]
  schedule:
    - cron: '43 6 * * *'
permissions:
  contents: write
jobs:
  score:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile prospective_score.py
      - name: Score only registered eligible forecasts
        id: score
        continue-on-error: true
        run: python prospective_score.py
      - name: Persist scored and quarantined results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/prospective/scores.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: score prospective DOGE forecasts'
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Fail on invalid audit
        if: steps.score.outcome != 'success'
        run: exit 1
