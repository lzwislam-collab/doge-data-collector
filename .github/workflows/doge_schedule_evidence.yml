name: Verify DOGE collector scheduled-run evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doge_schedule_evidence.py'
      - 'test_doge_schedule_evidence.py'
      - 'stage1_rolling_integrity.py'
      - 'test_stage1_rolling_integrity.py'
      - '.github/workflows/doge_schedule_evidence.yml'
  schedule:
    - cron: '44 2,8,14,20 * * *'
permissions:
  actions: read
  contents: write
concurrency:
  group: doge-schedule-evidence
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test healthy partial-window evidence policy
        run: |
          python -m py_compile doge_schedule_evidence.py stage1_rolling_integrity.py
          python -m unittest -v test_doge_schedule_evidence test_stage1_rolling_integrity
      - name: Verify schedule run events and persisted snapshot timestamps
        id: audit
        continue-on-error: true
        run: python doge_schedule_evidence.py
      - name: Save evidence report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/stage1/schedule_evidence.json ]; then git add -f data/stage1/schedule_evidence.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: verify scheduled DOGE collection evidence'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Report audit execution failure
        if: steps.audit.outcome != 'success'
        run: exit 1
