name: Audit future learned DOGE shadow candidate registration
on:
  workflow_dispatch:
  push:
    branches: [main, 'research/phase1-*']
    paths:
      - 'learned_shadow*.py'
      - 'test_learned_shadow*.py'
      - 'learned_audit_handoff.py'
      - 'test_learned_audit_handoff.py'
      - 'config/learned_shadow_v1.json'
      - 'research/learned_shadow_v1/**'
      - 'system/learned_shadow_v1_registry.json'
      - '.github/workflows/learned_shadow_v1.yml'
  pull_request:
    paths:
      - 'learned_shadow*.py'
      - 'test_learned_shadow*.py'
      - 'learned_audit_handoff.py'
      - 'test_learned_audit_handoff.py'
      - 'config/learned_shadow_v1.json'
      - 'research/learned_shadow_v1/**'
      - 'system/learned_shadow_v1_registry.json'
      - '.github/workflows/learned_shadow_v1.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: learned-shadow-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Full regression and frozen production history
        run: |
          python -m unittest discover -q
          python forward_validation_v2.py --integrity-only
      - name: Audit exact future bundle and probe raw public quote without predictions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python learned_shadow_bundle.py probe --out stage2-output
      - name: Preserve full audit and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doge-learned-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            stage2-output/
            config/learned_shadow_v1.json
            system/learned_shadow_v1_registry.json
            research/learned_shadow_v1/
          if-no-files-found: error
          retention-days: 90
  handoff:
    needs: audit
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Prepare one current-context handoff without sending a request
        id: handoff_prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B learned_audit_handoff.py prepare
      - name: Preserve immutable intent before any handoff request
        id: handoff_intent
        if: steps.handoff_prepare.outputs.prepared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: learned-audit-handoff-request-${{ github.run_id }}
          path: forward-readiness-output/learned-audit-handoff-prepare.json
          if-no-files-found: error
          retention-days: 90
      - name: Request existing readiness only after remote intent confirmation
        if: steps.handoff_prepare.outputs.prepared == 'true' && steps.handoff_intent.outputs.artifact-id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF_INTENT_ARTIFACT_ID: ${{ steps.handoff_intent.outputs.artifact-id }}
        run: python -B learned_audit_handoff.py post
      - name: Preserve handoff result even when its outcome is unknown
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learned-audit-handoff-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: forward-readiness-output/learned-audit-handoff-*.json
          if-no-files-found: error
          retention-days: 90
