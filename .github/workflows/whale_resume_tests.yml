name: Verify whale scanner resume boundaries
on:
  pull_request:
    paths: ['doge_whale_blocks.py', 'test_whale_block_resume.py', '.github/workflows/whale_blocks.yml', '.github/workflows/whale_resume_tests.yml']
permissions:
  contents: read
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest -v test_whale_block_resume

