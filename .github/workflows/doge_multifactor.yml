name: Audit DOGE BTC ETH multifactor predictions

on:
  workflow_dispatch:
  # Lean-v1.0: pause legacy/low-PIT-value automatic feed; historical and manual paths remain.

permissions:
  contents: write

concurrency:
  group: doge-multifactor-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical dependencies
        run: python -m pip install 'numpy==1.26.4' 'scikit-learn==1.5.2'
      - name: Run causal multifactor validation
        id: audit
        continue-on-error: true
        run: python doge_multifactor.py
      - name: Persist result including failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f data/multifactor/latest.json ]; then
            git add -f data/multifactor/latest.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: audit DOGE BTC ETH multifactor predictions'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Propagate validation failure
        if: steps.audit.outcome != 'success'
        run: exit 1
