name: Audit DOGE three-layer regressions and frozen integrity
on:
  workflow_dispatch:
  push:
    branches: [main, 'audit/layers-*']
    paths: ['doge_history.py', 'forward_readiness.py', 'test_daily_history_quality.py', 'test_forward_readiness.py', '.github/workflows/doge_history.yml', '.github/workflows/layer_audit_regression.yml']
  pull_request:
    paths: ['doge_history.py', 'forward_readiness.py', 'test_daily_history_quality.py', 'test_forward_readiness.py', '.github/workflows/doge_history.yml', '.github/workflows/layer_audit_regression.yml']
permissions:
  contents: read
concurrency:
  group: doge-three-layer-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2 joblib==1.5.2 threadpoolctl==3.6.0 botocore==1.43.112
      - name: All tests and unchanged original frozen history
        run: |
          mkdir -p three-layer-audit-output
          python -m unittest discover -q 2>&1 | tee three-layer-audit-output/tests.log
          python forward_validation_v2.py --integrity-only 2>&1 | tee three-layer-audit-output/frozen-integrity.log
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import phase3_runtime as p
          p.guard()
          result={'at_utc':datetime.now(timezone.utc).isoformat(),'head_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'frozen_three_layer_guard_passed':True,'real_orders_authorized':False,'statistical_promotion_claimed':False}
          Path('three-layer-audit-output/receipt.json').write_text(json.dumps(result,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-layer-audit-${{ github.run_id }}
          path: three-layer-audit-output/
          retention-days: 90
          if-no-files-found: error
