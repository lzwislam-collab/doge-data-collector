name: Audit DOGE four-layer regressions and frozen integrity
on:
  workflow_dispatch:
  push:
    branches: [main, 'audit/layers-*']
    paths: ['doge_history.py', 'forward_readiness.py', 'test_daily_history_quality.py', 'test_forward_readiness.py', '.github/workflows/doge_history.yml', '.github/workflows/layer_audit_regression.yml', 'okx_hourly_research_history.py', 'stored_history_integrity.py', 'research_artifact_audit.py', 'test_stored_history_integrity.py', 'test_research_artifact_audit.py', 'plus_shadow.py', 'test_plus_shadow.py', 'report_evidence.py', 'test_report_evidence.py']
  pull_request:
    paths: ['doge_history.py', 'forward_readiness.py', 'test_daily_history_quality.py', 'test_forward_readiness.py', '.github/workflows/doge_history.yml', '.github/workflows/layer_audit_regression.yml', 'okx_hourly_research_history.py', 'stored_history_integrity.py', 'research_artifact_audit.py', 'test_stored_history_integrity.py', 'test_research_artifact_audit.py', 'plus_shadow.py', 'test_plus_shadow.py', 'report_evidence.py', 'test_report_evidence.py']
permissions:
  contents: read
concurrency:
  group: doge-four-layer-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2 joblib==1.5.2 threadpoolctl==3.6.0 botocore==1.43.112 oss2==2.19.1 aliyun-python-sdk-core==2.16.1
      - name: All tests and unchanged original frozen history
        run: |
          set -euo pipefail
          mkdir -p four-layer-audit-output
          python -m unittest discover -q 2>&1 | tee four-layer-audit-output/tests.log
          python forward_validation_v2.py --integrity-only 2>&1 | tee four-layer-audit-output/frozen-integrity.log
          python - <<'PY'
          import json,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          import phase3_runtime as p
          p.guard()
          import doge_history as daily,okx_hourly_research_history as hourly
          import phase1_research_audit as data,plus_shadow as plus
          daily_rows=daily.loadcsv(daily.BASE/'daily.csv');hourly_rows=hourly.read_old()
          _,source=data.audit(Path('.'),datetime.now(timezone.utc))
          policy=json.loads(Path('config/factor_eligibility_v1.json').read_bytes())
          assert source['catalog_sha256']==policy['catalog_sha256']
          view=plus.snapshot(online=False)
          assert view['release_selection']['reason']=='OFFLINE_AUTHORITY_NOT_RECHECKED'
          assert not any(view[k] for k in ('issuance_performed','production_model_changed','promotion_authorized','real_orders_authorized','validated_70pct'))
          result={'at_utc':datetime.now(timezone.utc).isoformat(),'head_sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'frozen_four_layer_guard_passed':True,'daily_rows':len(daily_rows),'hourly_rows':len(hourly_rows),'source_audit':source,'plus_status':view['status'],'formal_counts':view['journal_counts'],'real_orders_authorized':False,'statistical_promotion_claimed':False}
          Path('four-layer-audit-output/receipt.json').write_text(json.dumps(result,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-layer-audit-${{ github.run_id }}
          path: four-layer-audit-output/
          retention-days: 90
          if-no-files-found: error
