name: Publish DOGE R2 engineering transport v1
run-name: R2E1 publish ${{ inputs.request_id || github.event_name }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Original formal paper runtime or excluded engineering canary
        type: choice
        options: [publish, canary]
        default: publish
      request_id:
        description: Bounded engineering dispatch identity
        type: string
        required: false
      expected_head:
        description: Exact intended main head
        type: string
        required: false
      not_after_utc:
        description: Original obligation deadline
        type: string
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: phase2-forward-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Exact requested head and original deadline
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          NOT_AFTER_UTC: ${{ inputs.not_after_utc }}
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json, os, subprocess
          expected, deadline = os.environ['EXPECTED_HEAD'], os.environ['NOT_AFTER_UTC']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if actual != os.environ['GITHUB_SHA']:
              raise ValueError('engineering checkout differs from actual Actions head')
          print(json.dumps({'expected_head': expected, 'actual_actions_head': actual}))
          if deadline and datetime.now(timezone.utc) >= datetime.fromisoformat(deadline.replace('Z', '+00:00')):
              raise ValueError('original obligation window closed')
          import r2_engineering_runtime as engine
          engine.verify_transport()
          PY
      - name: Original frozen integrity
        run: python forward_validation_v2.py --integrity-only
      - name: Actual-clock original paper capture and due score through engineering v1
        id: runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_MODE: ${{ inputs.mode || 'publish' }}
        run: python r2_engineering_runtime.py "$RUNTIME_MODE"
      - name: Publish only isolated append journal with original bounded conflict retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data/phase2_forward_v2 ]; then git add -f data/phase2_forward_v2; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: append real V2 forward paper evidence through engineering v1'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
              git fetch origin main
              git rebase origin/main
              python -c "import r2_engineering_runtime as runtime; runtime.run('local')"
            done
          fi
      - name: Prepare exact public witness intent after successful push
        id: audit_prepare
        if: steps.runtime.outputs.request_witness == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python r2_engineering_dispatch.py prepare
      - name: Preserve immutable audit intent before any dispatch
        id: audit_intent
        if: steps.audit_prepare.outputs.prepared == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: r2-engineering-audit-intent-${{ github.run_id }}
          path: phase2-forward-output/engineering-audit-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Request exact public server witness after immutable intent upload
        if: steps.audit_prepare.outputs.prepared == 'true' && steps.audit_intent.outputs.artifact-id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENGINEERING_INTENT_ARTIFACT_ID: ${{ steps.audit_intent.outputs.artifact-id }}
        run: python r2_engineering_dispatch.py audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r2-engineering-live-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase2-forward-output/
            config/r2_engineering_transport_v1.json
          if-no-files-found: warn
          retention-days: 90
      - name: Report errors after preserving original captures
        if: steps.runtime.outputs.has_errors == 'true'
        run: exit 1
