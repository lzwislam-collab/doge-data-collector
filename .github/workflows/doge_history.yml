name: Backfill OKX daily DOGE BTC ETH history and baseline backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doge_history.py'
      - '.github/workflows/doge_history.yml'
  schedule:
    - cron: '37 0 * * *' # 00:37 UTC first attempt, if previous UTC candle confirmed
    - cron: '17 1,10,18 * * *' # 01:17 UTC fallback plus later data collection
permissions:
  contents: write
concurrency:
  group: doge-history-collector
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test registry and scoring integrity
        run: python -m unittest -v test_prospective_score test_prospective_integrity test_forecast_v41 test_calibration_v41 test_ops_v41
      # Exclusive automatic writer for prospective registry and scoring.
      - name: Backfill historical UTC close data and audit
        id: collect
        continue-on-error: true
        run: python doge_history.py
      # Legacy baseline registry remains frozen; old eligible forecasts continue to be scored.
      - name: Score matured prospective entries
        id: score
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python prospective_score.py
      - name: Generate V4.1 price intervals, append forecast, and walk-forward audit
        id: v41
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python forecast_v41.py
      - name: Score matured V4.1 prospective intervals
        id: v41_score
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python score_v41.py
      - name: Evaluate research-only historical interval calibration challenger
        id: v41_calibration
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python research_interval_calibration.py
      - name: Render V4.1 complete 11-section report with freshness labels
        id: v41_report
        if: steps.v41.outcome == 'success' && steps.v41_score.outcome == 'success'
        continue-on-error: true
        run: python report_v41.py
      - name: Audit daily V4.1 completeness and missing forecast registration
        id: v41_ops
        if: steps.v41_report.outcome == 'success'
        continue-on-error: true
        run: python audit_v41_operations.py
      - name: Commit data and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/history/latest.json data/history/daily.csv data/history/backtest_latest.json data/prospective/latest.json data/prospective/registry.csv data/prospective/scores.json data/forecast_v41/latest.json data/forecast_v41/backtest_latest.json data/forecast_v41/registry.csv data/forecast_v41/scores.json data/forecast_v41/calibration_research.json data/forecast_v41/operations.json reports/DOGE_V41_LATEST.md; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: update UTC daily history and audit baseline'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Fail on data collection errors
        if: steps.collect.outcome != 'success' || steps.score.outcome != 'success' || steps.v41.outcome != 'success' || steps.v41_score.outcome != 'success' || steps.v41_report.outcome != 'success' || steps.v41_calibration.outcome != 'success' || steps.v41_ops.outcome != 'success'
        run: exit 1
