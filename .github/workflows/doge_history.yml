name: Backfill OKX daily DOGE BTC ETH history and baseline backtest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'doge_history.py'
      - '.github/workflows/doge_history.yml'
  schedule:
    - cron: '17 2,10,18 * * *'
permissions:
  contents: write
concurrency:
  group: doge-history-collector
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test registry and scoring integrity
        run: python -m unittest -v test_prospective_score test_prospective_integrity test_forecast_v41
      # Exclusive automatic writer for prospective registry and scoring.
      - name: Backfill historical UTC close data and audit
        id: collect
        continue-on-error: true
        run: python doge_history.py
      - name: Register newest prospective DOGE baseline
        id: register
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python prospective_forecast.py
      - name: Score matured prospective entries
        id: score
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python prospective_score.py
      - name: Generate V4.1 price intervals, append forecast, and walk-forward audit
        id: v41
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python forecast_v41.py
      - name: Score matured V4.1 prospective intervals
        id: v41_score
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python score_v41.py
      - name: Commit data and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/history/latest.json data/history/daily.csv data/history/backtest_latest.json data/prospective/latest.json data/prospective/registry.csv data/prospective/scores.json data/forecast_v41/latest.json data/forecast_v41/backtest_latest.json data/forecast_v41/registry.csv data/forecast_v41/scores.json; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: update UTC daily history and audit baseline'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Fail on data collection errors
        if: steps.collect.outcome != 'success' || steps.register.outcome != 'success' || steps.score.outcome != 'success' || steps.v41.outcome != 'success' || steps.v41_score.outcome != 'success'
        run: exit 1
