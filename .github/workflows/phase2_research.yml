name: DOGE Phase2 automatic quantitative research
on:
  workflow_dispatch:
  push:
    branches: [main, 'research/phase2-*']
    paths: ['research_artifact_audit.py', 'test_research_artifact_audit.py', 'phase2_*.py', 'test_phase2_research.py', 'config/phase2_research_v1.json', '.github/workflows/phase2_research.yml']
  pull_request:
    paths: ['research_artifact_audit.py', 'test_research_artifact_audit.py', 'phase2_*.py', 'test_phase2_research.py', 'config/phase2_research_v1.json', '.github/workflows/phase2_research.yml']
permissions:
  contents: read
concurrency:
  group: phase2-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed numerical runtime and SDK contract regression
        run: python -m pip install numpy==2.3.5 botocore==1.43.112
      - name: Full regressions and original frozen history
        run: |
          python -m unittest discover -q
          python forward_validation_v2.py --integrity-only
      - name: Export exact registered source without editing main
        run: python phase1_research_snapshot.py --out "$RUNNER_TEMP/phase2-input"
      - name: Automatic factor hypotheses, train, validate, test and register
        run: python phase2_research.py --source "$RUNNER_TEMP/phase2-input" --out phase2-output
      - name: Independent second execution and exact model/artifact comparison
        run: |
          python phase2_research.py --source "$RUNNER_TEMP/phase2-input" --out "$RUNNER_TEMP/phase2-repeat"
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          import phase2_research as engine
          first=Path('phase2-output');second=Path(os.environ['RUNNER_TEMP'])/'phase2-repeat'
          engine.verify_output(first);engine.verify_output(second)
          names=['research.json','registry.json']+[p.relative_to(first).as_posix() for folder in ('models','candidates') for p in (first/folder).glob('*.json')]
          assert all((first/p).read_bytes()==(second/p).read_bytes() for p in names)
          one=json.loads((first/'research.json').read_bytes())
          assert one['actual_fits']<=one['policy']['max_fits'] and not one['production_promotion_authorized']
          record={'status':'EXACT_BYTES_REPRODUCED','compared_artifacts':len(names),'experiment_id':one['experiment_id'],
                  'research_sha256':hashlib.sha256((first/'research.json').read_bytes()).hexdigest(),
                  'production_model_changed':False,'real_orders_authorized':False}
          (first/'reproducibility.json').write_bytes(engine.encode(record))
          print(json.dumps(record))
          PY
      - name: Independently audit research authorization and saved metric semantics
        run: python research_artifact_audit.py verify --out phase2-output
      - name: Preserve actual research and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doge-phase2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase2-output/
            config/phase2_research_v1.json
            docs/superpowers/specs/2026-10-14-phase2-engine.md
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
