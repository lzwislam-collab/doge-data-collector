name: Audit DOGE predictive claim eligibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prediction_gate.py'
      - 'stage5_70pct_audit.py'
      - 'test_stage5_70pct_audit.py'
      - 'stage5_forward_quality.py'
      - 'forward_validation.py'
      - 'forward_validation_v2.py'
      - 'p1_model_competition.py'
      - 'test_p1_model_competition.py'
      - 'data/stage5/p1_model_league_protocol.json'
      - 'p1_adaptive_v2.py'
      - 'test_p1_adaptive_v2.py'
      - 'data/stage5/p1_adaptive_v2_protocol.json'
      - 'quote_evidence_v2.py'
      - 'test_forward_validation_v2.py'
      - 'test_quote_evidence_v2.py'
      - 'data/stage5/forward_validation_protocol_v2.json'
      - 'test_forward_validation.py'
      - 'data/stage5/forward_validation_protocol.json'
      - 'stage5_error_review.py'
      - 'test_stage5_error_review.py'
      - 'spot_plus_research.py'
      - 'spot_plus_context.py'
      - 'test_spot_plus_research.py'
      - 'spot_plus_daily_evolution.py'
      - 'test_spot_plus_daily_evolution.py'
      - 'spot_plus_live_quote.py'
      - 'test_spot_plus_live_quote.py'
      - 'spot_plus_quote_watch.py'
      - 'test_spot_plus_quote_watch.py'
      - 'feed_freshness_audit.py'
      - 'test_feed_quality.py'
      - 'test_stage5_forward_quality.py'
      - '.github/workflows/prediction_gate.yml'
      - 'data/quality/latest.json'
      - 'data/prob_baseline/latest.json'
  schedule:
    - cron: '37 5 * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: okx-hourly-extreme-history # shared prospective writer; refresh after source recovery
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main # refresh after acquiring shared writer lock
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Stage 5 score integrity and confidence intervals
        run: |
          python -m py_compile prediction_gate.py stage5_70pct_audit.py stage5_forward_quality.py stage5_error_review.py spot_plus_research.py spot_plus_context.py spot_plus_daily_evolution.py spot_plus_live_quote.py
          python -m unittest -v test_stage5_70pct_audit test_stage5_forward_quality test_stage5_error_review test_spot_plus_research test_spot_plus_daily_evolution test_spot_plus_quote_watch test_spot_plus_live_quote
      - name: Verify and report complete prospective evidence and fixed spot paper costs
        id: forward_validation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m unittest -q test_forward_validation test_quote_evidence_v2 test_forward_validation_v2
          python forward_validation_v2.py --daily
      - name: Score independent P1 challenger after official V2 evidence validation
        id: p1_league
        if: steps.forward_validation.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest -q test_p1_model_competition
          python p1_model_competition.py
      - name: Train and issue prospective P1 V2 shadow from real current market quote
        id: p1_adaptive
        if: steps.forward_validation.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest -q test_p1_adaptive_v2
          python p1_adaptive_v2.py
      - name: Synchronize latest source health and timestamps before forecasting
        id: freshness
        continue-on-error: true
        run: |
          python -m unittest -q test_feed_quality
          python feed_freshness_audit.py
      - name: Independently refresh error review without changing original forecasts
        id: error_review
        continue-on-error: true
        if: steps.freshness.outcome == 'success'
        run: python stage5_error_review.py
      - name: Independently audit 70-percent direction target and prospective samples
        id: stage5
        continue-on-error: true
        if: steps.freshness.outcome == 'success' && steps.error_review.outcome == 'success'
        run: python stage5_70pct_audit.py
      - name: Integrate all five DOGE source pillars and independently paper-test spot profit
        id: spot_plus
        continue-on-error: true
        if: steps.freshness.outcome == 'success' && steps.stage5.outcome == 'success'
        run: python spot_plus_research.py
      - name: Capture validated fresh OKX DOGE BTC ETH spot snapshot (independent of historical prediction)
        id: spot_live
        continue-on-error: true
        run: python spot_plus_live_quote.py
      - name: Append once-per-UTC-day hash-linked research progress and refresh daily human report
        id: evolution
        if: steps.spot_plus.outcome == 'success' && steps.stage5.outcome == 'success'
        continue-on-error: true
        run: |
          python spot_plus_daily_evolution.py
          python - <<'PY'
          from pathlib import Path
          p=Path('reports/DOGE_SPOT_PLUS_DAILY.md')
          p.write_text('正式前瞻成绩请查看 [V2日报](DOGE_FORWARD_VALIDATION_V2_DAILY.md)。以下旧协议成绩为独立历史诊断，不作为V2验收依据。\n\n'+p.read_text(),encoding='utf-8')
          PY
      - name: Audit claim eligibility
        id: audit
        continue-on-error: true
        if: steps.freshness.outcome == 'success' && steps.spot_plus.outcome == 'success' && steps.evolution.outcome == 'success'
        run: python prediction_gate.py
      - name: Commit result including failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/quality/latest.json data/prediction_gate/latest.json data/stage5/latest.json data/stage5/error_review/latest.json data/stage5/spot_plus/latest.json data/stage5/spot_plus/evolution_latest.json data/stage5/spot_plus/evolution_log.csv data/stage5/spot_plus/live_quote_latest.json data/stage5/forward_validation/daily_latest.json reports/DOGE_FORWARD_VALIDATION_DAILY.md reports/DOGE_SPOT_PLUS_DAILY.md data/stage5/forward_validation_v2/daily_latest.json reports/DOGE_FORWARD_VALIDATION_V2_DAILY.md data/stage5/p1_model_league/latest.json reports/DOGE_P1_MODEL_LEAGUE.md; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if [ -d data/stage5/p1_adaptive_v2 ]; then git add -f data/stage5/p1_adaptive_v2; fi
          if [ -f reports/DOGE_P1_ADAPTIVE_V2.md ]; then git add -f reports/DOGE_P1_ADAPTIVE_V2.md; fi
          if ! git diff --cached --quiet; then
            git commit -m 'audit: DOGE forecast publication gate'
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Fail on invalid input audit
        if: steps.p1_adaptive.outcome != 'success' || steps.p1_league.outcome != 'success' || steps.forward_validation.outcome != 'success' || steps.freshness.outcome != 'success' || steps.audit.outcome != 'success' || steps.stage5.outcome != 'success' || steps.error_review.outcome != 'success' || steps.spot_plus.outcome != 'success' || steps.evolution.outcome != 'success' || steps.spot_live.outcome != 'success'
        run: exit 1
