name: Audit DOGE predictive claim eligibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'prediction_gate.py'
      - 'stage5_70pct_audit.py'
      - 'test_stage5_70pct_audit.py'
      - '.github/workflows/prediction_gate.yml'
      - 'data/quality/latest.json'
      - 'data/prob_baseline/latest.json'
  schedule:
    - cron: '37 5 * * *'
permissions:
  contents: write
concurrency:
  group: doge-prediction-gate
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test Stage 5 score integrity and confidence intervals
        run: |
          python -m py_compile prediction_gate.py stage5_70pct_audit.py
          python -m unittest -v test_stage5_70pct_audit
      - name: Independently audit 70-percent direction target and prospective samples
        id: stage5
        continue-on-error: true
        run: python stage5_70pct_audit.py
      - name: Audit claim eligibility
        id: audit
        continue-on-error: true
        run: python prediction_gate.py
      - name: Commit result including failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for file in data/prediction_gate/latest.json data/stage5/latest.json; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'audit: DOGE forecast publication gate'
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$i" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Fail on invalid input audit
        if: steps.audit.outcome != 'success' || steps.stage5.outcome != 'success'
        run: exit 1
