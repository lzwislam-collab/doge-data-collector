name: DOGE rolling PoR UTXO candidate audit (not exchange netflow)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['DOGE confirmed block whale scanner']
    types: [completed]

permissions:
  contents: write

concurrency:
  group: doge-rolling-por-utxo-audit
  cancel-in-progress: false

jobs:
  analyze:
    # Only process the upstream run created during 03:00-03:59 UTC (~4 opportunities/day),
    # to avoid 96 extra paid GitHub runner-minutes per day. No new cron.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && contains(github.event.workflow_run.created_at, 'T03:'))
    runs-on: ubuntu-24.04
    env:
      UPSTREAM_WHALE_RUN_ID: ${{ github.event.workflow_run.id || '' }}
      UPSTREAM_WHALE_RUN_EVENT: ${{ github.event.workflow_run.event || '' }}
      UPSTREAM_WHALE_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
      UPSTREAM_WHALE_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at || '' }}
    timeout-minutes: 11
    steps:
      - name: Checkout latest main snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Incrementally audit existing confirmed whale events
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          python -m unittest -v test_doge_rolling_utxo
          python doge_rolling_utxo.py
      - name: Commit incremental output and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/stage1/rolling_por_utxo_events.csv data/stage1/rolling_por_utxo_latest.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: update rolling historical PoR UTXO candidate audit'
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$i" = 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Fail if audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
