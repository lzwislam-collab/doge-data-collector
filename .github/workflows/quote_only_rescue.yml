name: Independent DOGE target quote rescue
on:
  workflow_dispatch:
    inputs:
      expected_ids_json:
        description: JSON array witnessing still-open unscored IDs; stale requests skip; captures current open batch
        required: true
        type: string
  pull_request:
    paths: ['quote_only_rescue.py', 'test_quote_only_rescue.py', 'test_quote_only_rescue_scope.py', 'apps_script/quote_rescue_live.gs', 'apps_script/test_quote_rescue_live.cjs', '.github/workflows/quote_only_rescue.yml']
  push:
    branches: [main]
    paths: ['quote_only_rescue.py', 'test_quote_only_rescue.py', 'test_quote_only_rescue_scope.py', 'apps_script/quote_rescue_live.gs', 'apps_script/test_quote_rescue_live.cjs', '.github/workflows/quote_only_rescue.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 85 && github.head_ref == 'ci/strict24-isolation-ubuntu-20261106' && 8 || 5 }}
    steps:
      - name: Start non-production budget clock
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 85 && github.head_ref == 'ci/strict24-isolation-ubuntu-20261106'
        run: |
          python3 - <<'PY'
          import os,time
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write(f'SCALE_JOB_STARTED_EPOCH={time.time()}\nSCALE_JOB_STARTED_MONOTONIC={time.monotonic()}\n')
          PY
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse accepted functional CI only for identical code and protocols
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 85 && github.head_ref == 'ci/strict24-isolation-ubuntu-20261106'
        id: prior
        run: python .github/scripts/quote_rescue_scale_diagnostic.py --identity --out "$RUNNER_TEMP/quote-scale-evidence"
      - if: steps.prior.outputs.reuse != 'true'
        run: python -m unittest test_quote_only_rescue test_quote_only_rescue_scope test_quote_evidence_v2 test_publish_forward_evidence -v
      - uses: actions/setup-node@v4
        if: steps.prior.outputs.reuse != 'true'
        with:
          node-version: '22'
      - if: steps.prior.outputs.reuse != 'true'
        run: node apps_script/test_quote_rescue_live.cjs
      - name: Measure fixed actual-scale input in temporary local repositories
        if: steps.prior.outputs.reuse == 'true'
        run: python .github/scripts/quote_rescue_scale_diagnostic.py --out "$RUNNER_TEMP/quote-scale-evidence"
      - name: Retain small non-production diagnosis
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 85 && github.head_ref == 'ci/strict24-isolation-ubuntu-20261106'
        uses: actions/upload-artifact@v4
        with:
          name: nonproduction-scale-diagnosis-${{ github.run_id }}
          path: ${{ runner.temp }}/quote-scale-evidence
          if-no-files-found: error
          retention-days: 3
  rescue:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    concurrency:
      group: okx-hourly-extreme-history
      cancel-in-progress: false
      queue: max # joining this group must not replace a pending normal collector
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # acquired shared lock first; do not capture from the dispatch head
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture only a still-open TARGET and verify persisted raw evidence
        env:
          EXPECTED_IDS_JSON: ${{ inputs.expected_ids_json }}
        run: python quote_only_rescue.py --expected-ids-json "$EXPECTED_IDS_JSON"
      - name: Retain compact independent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-rescue-result-${{ github.run_id }}
          path: quote_rescue_result.json
          if-no-files-found: ignore
          retention-days: 3
