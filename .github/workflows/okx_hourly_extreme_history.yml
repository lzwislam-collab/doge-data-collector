name: Backfill DOGE BTC ETH 1H extreme-event research history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'okx_hourly_research_history.py'
      - 'runtime_deadline_service.py'
      - 'archive_capture_bridge.py'
      - 'test_archive_capture_bridge.py'
      - 'runtime_audit_worker.py'
      - 'stored_history_integrity.py'
      - 'evaluate_crash_warning.py'
      - 'crash_forward_watch.py'
      - 'test_crash_forward_watch.py'
      - 'crash_v42_score.py'
      - 'direction_forward_v42.py'
      - 'test_direction_forward_v42.py'
      - 'stage5_minute_shadow.py'
      - 'test_stage5_minute_shadow.py'
      - 'stage5_error_review.py'
      - 'test_stage5_error_review.py'
      - 'spot_plus_quote_watch.py'
      - 'forward_validation.py'
      - 'forward_validation_v2.py'
      - 'quote_evidence_v2.py'
      - 'test_forward_validation_v2.py'
      - 'test_workflow_operational_order.py'
      - 'quote_capture_retry.py'
      - 'p0_operational_audit.py'
      - 'supplemental_evidence_audit.py'
      - 'plus_evidence_version.py'
      - 'source_evidence_snapshot.py'
      - 'forward_execution_evidence.py'
      - 'evidence_retention.py'
      - 'pit_retention_preparation.py'
      - 'feature_publication_gate.py'
      - 'publication_recovery.py'
      - 'engineering_run_receipt.py'
      - 'direction_lateness_gate.py'
      - 'forward_diagnostics.py'
      - 'p0_open_target_guard.py'
      - 'test_forward_diagnostics.py'
      - 'test_p0_open_target_guard.py'
      - 'paired_selection_v1.py'
      - 'paired_forward_cohort.py'
      - 'paired_cohort_audit.py'
      - 'test_paired_selection_v1.py'
      - 'test_paired_forward_cohort.py'
      - 'test_paired_cohort_audit.py'
      - 'data/stage5/paired_selection_v1_protocol.json'
      - 'system/current_paired_shadow.json'
      - 'p2_paired_execution_v2.py'
      - 'p2_execution_registration.py'
      - 'test_p2_paired_execution_v2.py'
      - 'test_p2_execution_records.py'
      - 'p2_paired_execution_v3_1.py'
      - 'p2_execution_registration_v3_1.py'
      - 'test_p2_paired_execution_v3_1.py'
      - 'test_p2_execution_records_v3_1.py'
      - 'test_p2_paired_execution_v3_1_regressions.py'
      - 'p2_path_quality.py'
      - 'test_p2_path_quality.py'
      - 'p1_regime_forward_v1.py'
      - 'test_p1_regime_forward_v1.py'
      - 'data/stage5/p1_regime_forward_v1_protocol.json'
      - 'p2_locked_forward_v1.py'
      - 'test_p2_locked_forward_v1.py'
      - 'data/stage5/p2_locked_forward_v1_protocol.json'
      - 'test_p2_registration_deployed_bytes.py'
      - 'derived_four_hour.py'
      - 'feature_ablation.py'
      - 'enhancement_sources.py'
      - 'evidence_append_guard.py'
      - 'test_derived_four_hour.py'
      - 'test_feature_ablation.py'
      - 'data/stage5/feature_ablation_v1_protocol.json'
      - 'data/stage5/p2_paired_execution_v3_1_protocol.json'
      - 'data/stage5/p2_paired_execution_v2_protocol.json'
      - 'test_p0_operations.py'
      - 'publish_forward_evidence.py'
      - '.github/scripts/p0_alert.cjs'
      - 'test_quote_evidence_v2.py'
      - 'data/stage5/forward_validation_protocol_v2.json'
      - 'test_forward_validation.py'
      - 'data/stage5/forward_validation_protocol.json'
      - 'test_spot_plus_quote_watch.py'
      - 'data/stage5/minute_evaluation_protocol.json'
      - 'test_crash_v42_score.py'
      - '.github/workflows/okx_hourly_extreme_history.yml'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *' # one existing schedule; 10m polls reserve 15m within frozen 25m quote grace
permissions:
  contents: write
  actions: write # dispatch existing read-only CI as a pre-target server witness
  issues: write # P0 failure alerts on existing Issue 5
concurrency:
  group: okx-hourly-extreme-history # shared with daily audit and short raw-quote job; long scans are separate
  cancel-in-progress: false
jobs:
  hourly-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 65 # 40m serial deadline service + existing research/archive tail + margin
    env:
      DOGE_ARCHIVE_QUALIFIED_DRAIN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main # read current data after the shared concurrency lock is acquired
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fail closed before writes on full-history or frozen protocol mutation
        run: python forward_validation_v2.py --integrity-only
      - name: Score genuine due target quotes before long collection steps
        id: quote_watch
        continue-on-error: true
        run: python quote_capture_retry.py watch
      - name: Fast-refresh confirmed 1H bars before prediction issuance
        id: fast_hourly
        continue-on-error: true
        run: |
          DOGE_HOURLY_PAGE_BUDGET=0 python okx_hourly_research_history.py
      - name: Prepare UTC4H and causal feature context before original issuance
        id: feature_prepare
        continue-on-error: true
        run: |
          python derived_four_hour.py
          python feature_ablation.py prepare
      - name: Prepare isolated minimal market rules before existing issuance
        id: minimal_prepare
        continue-on-error: true
        timeout-minutes: 1
        run: python minimal_market_forward.py prepare
      - name: Issue and score DOGE UP/DOWN shadow forecasts from live ticker quote
        id: direction
        continue-on-error: true
        run: |
          python direction_lateness_gate.py begin "$RUNNER_TEMP/doge-direction-attempt.json"
          python paired_forward_cohort.py issue
      - name: Bind only new originals to independent minimal market rules
        id: minimal_bind
        if: always() && steps.minimal_prepare.outcome == 'success'
        continue-on-error: true
        run: python minimal_market_forward.py bind
      - name: Bind genuinely new original events to isolated feature ablations
        id: feature_bind
        if: always() && steps.feature_prepare.outcome == 'success'
        continue-on-error: true
        run: |
          python feature_ablation.py bind > "$RUNNER_TEMP/doge-feature-bind.json"
          cat "$RUNNER_TEMP/doge-feature-bind.json"
          python feature_publication_gate.py < "$RUNNER_TEMP/doge-feature-bind.json" >> "$GITHUB_OUTPUT"
      - name: Verify benign late-registration skip without changing frozen deadline
        id: direction_late_audit
        if: steps.direction.outcome != 'success'
        continue-on-error: true
        run: python direction_lateness_gate.py verify "$RUNNER_TEMP/doge-direction-attempt.json"
      - name: Publish time-sensitive evidence and verify remote readback before backfill
        id: early_publish
        if: always() && steps.quote_watch.outcome != 'skipped'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          refresh_failed=0
          DOGE_HOURLY_PUBLICATION_REFRESH=1 python okx_hourly_research_history.py || refresh_failed=1
          DOGE_HOURLY_REFRESH_FAILED="$refresh_failed" DOGE_VERIFY_HOURLY_PUBLICATION=1 python publication_recovery.py
      - name: Read back minimal contexts from the same original publication
        id: minimal_publication
        if: steps.early_publish.outcome == 'success' && steps.minimal_bind.outcome == 'success'
        continue-on-error: true
        run: python minimal_market_forward.py publication
      - name: Verify staged feature archive on actual remote publication
        id: feature_publication
        if: steps.early_publish.outcome == 'success' && steps.feature_bind.outcome == 'success' && steps.feature_bind.outputs.needs_publication == 'true'
        continue-on-error: true
        run: python feature_ablation.py publication
      - name: Create pre-target public server witness using existing read-only CI
        id: public_witness
        # Recovery after a successful push but failed readback still needs a server witness.
        # Duplicate read-only witnesses never issue forecasts or backdate eligibility.
        if: steps.early_publish.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'test_forward_validation.yml', ref: 'main'
            });
      - name: Keep genuine target and depth capture alive before slow research
        id: deadline_service
        if: always() && steps.early_publish.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python runtime_deadline_service.py --duration-seconds 2400 --archive-reserve-seconds 1800
      - name: Preserve immutable deadline service receipts even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doge-runtime-deadlines-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/runtime_deadline_v1/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop subsequent writers on fatal runtime integrity or publication failure
        if: always() && steps.deadline_service.outputs.fatal != 'false'
        run: exit 1
      - name: Recover optional hourly source with fresh bytes after deadline capture
        id: hourly_source_recovery
        if: success() && steps.deadline_service.outputs.fatal == 'false' && steps.early_publish.outputs.hourly_source_failed == 'true'
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python hourly_publication_recovery.py
      - name: Backfill confirmed UTC 1H data with source-ingestion timestamps
        id: collect
        continue-on-error: true
        run: |
          hour=$(date -u +%H)
          if [ "$hour" = "03" ] || [ "$hour" = "15" ]; then export DOGE_HOURLY_PAGE_BUDGET=24; else export DOGE_HOURLY_PAGE_BUDGET=0; fi
          python okx_hourly_research_history.py
      - name: Evaluate hourly extreme-down alert precision and recall
        id: evaluate
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python evaluate_crash_warning.py
      - name: Register genuinely prospective hourly risk checkpoint and score matured alerts
        id: forward
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python crash_forward_watch.py
      - name: V4.2 forward-only one-hour-lead risk scoring
        id: v42
        if: steps.forward.outcome == 'success'
        continue-on-error: true
        run: python crash_v42_score.py
      - name: Independently score target outcomes using confirmed OKX 1m bars
        id: minute_shadow
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python stage5_minute_shadow.py
      - name: Review DOGE direction errors, source gaps and market co-movement without modifying frozen forecasts
        id: error_review
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python stage5_error_review.py
      - name: Recheck genuinely open target windows after slow collection steps
        id: open_target_guard
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.quote_watch.outcome != 'skipped'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOGE_TAIL_CAPTURE_BRIDGE: '1'
        run: python p0_open_target_guard.py
      - name: Stop writers on unsafe tail bridge or missing guard output
        if: always() && steps.open_target_guard.outputs.tail_fatal != 'false'
        run: exit 1
      - name: Audit original quotes, publication receipts, baselines and prospective spot paper
        id: validation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python forward_validation_v2.py
      - name: Test hourly point-in-time registry causal restrictions after time-sensitive evidence capture
        id: regression
        continue-on-error: true
        run: python -m unittest -v test_crash_forward_watch test_crash_v42_score test_direction_forward_v42 test_stage5_minute_shadow test_stage5_error_review test_spot_plus_quote_watch test_forward_validation test_quote_evidence_v2 test_forward_validation_v2 test_workflow_operational_order test_p0_operations test_publish_forward_evidence test_forward_diagnostics test_p0_open_target_guard test_paired_selection_v1 test_paired_forward_cohort test_paired_cohort_audit
      - name: Reconcile strict rolling seven-day issuance and target evidence
        id: operations
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.validation.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python p0_operational_audit.py
      - name: Independently audit same-event challengers and all NO_TRADE forecasts
        id: paired_audit
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.operations.outcome == 'success'
        continue-on-error: true
        run: python paired_cohort_audit.py
      - name: Verify real paired model preparation and live book without issuing smoke forecasts
        id: paired_smoke
        if: github.event_name == 'push' && steps.operations.outcome == 'success'
        continue-on-error: true
        run: python paired_forward_cohort.py smoke
      - name: Capture public paired decisions into independent P2 spot paper portfolios
        id: p2_execution
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.paired_audit.outcome == 'success'
        continue-on-error: true
        run: python p2_paired_execution_v2.py capture
      - name: Verify P2 raw book capacity and cost arithmetic without fake intervals
        id: p2_execution_smoke
        if: github.event_name == 'push' && steps.paired_audit.outcome == 'success'
        continue-on-error: true
        run: python p2_paired_execution_v2.py smoke
      - name: Test independent P2 chronology costs benchmarks and immutable evidence
        id: p2_execution_tests
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false'
        continue-on-error: true
        run: python -m unittest -q test_p2_paired_execution_v2 test_p2_execution_records
      - name: Capture independent repaired V3 P2 paper evidence
        id: p2_execution_v3
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.paired_audit.outcome == 'success'
        continue-on-error: true
        run: python p2_paired_execution_v3_1.py capture
      - name: Verify V3 live book without creating formal intervals
        id: p2_execution_v3_smoke
        if: github.event_name == 'push' && steps.paired_audit.outcome == 'success'
        continue-on-error: true
        run: python p2_paired_execution_v3_1.py smoke
      - name: Test V3 coverage tail gaps and preserved execution behavior
        id: p2_execution_v3_tests
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false'
        continue-on-error: true
        run: python -m unittest -q test_p2_paired_execution_v3_1 test_p2_execution_records_v3_1 test_p2_paired_execution_v3_1_regressions test_p2_registration_deployed_bytes
      - name: Audit actual P2 book sampling gaps and preserve original source records
        id: p2_path
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.p2_execution_v3.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest -q test_p2_path_quality
          python p2_path_quality.py
      - name: Evaluate preregistered independent P2 forward cohort without replacing V3.1
        id: locked_forward_cohort
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.p2_execution_v3.outcome == 'success' && steps.p2_path.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest -q test_p2_locked_forward_v1
          python p2_locked_forward_v1.py
      - name: Audit minimal future pairs and independent P2 acceptance
        id: minimal_audit
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.operations.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m unittest -q test_minimal_market_candidate test_minimal_market_forward test_minimal_market_workflow test_p2_economic_acceptance test_p1_regime_forward_v1
          python minimal_market_forward.py audit
          python p2_economic_acceptance.py
          python p1_regime_forward_v1.py
      - name: Audit isolated feature comparisons and net economics
        id: feature_audit
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.operations.outcome == 'success'
        continue-on-error: true
        run: |
          python -m unittest -q test_derived_four_hour test_feature_ablation
          python feature_ablation.py audit
      - name: Capture independent source versions and prospective post-publication depth
        id: supplemental_evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.operations.outcome == 'success'
        continue-on-error: true
        run: python supplemental_evidence_audit.py --capture-execution
      - name: Audit deadline risk probability reliability and prospective cost stress separately
        id: diagnostics
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.supplemental_evidence.outcome == 'success'
        continue-on-error: true
        run: |
          python forward_diagnostics.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/forward_diagnostics_v1/latest.json').read_text())
          counts={s:sum(x['state']==s for x in r['deadline_radar']) for s in ('DUE_OPEN','DUE_URGENT','MISSED_WINDOW')}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### DOGE forward diagnostics V1\n\nNO_TRADE; frozen scores unchanged.\n\n'+json.dumps(counts)+'\n')
          if counts['DUE_URGENT']: print('::warning::Genuine target quote window closes within 10 minutes; no backfill allowed')
          PY
      - name: Prepare daily PIT retention inventory after original evidence capture
        id: pit_preparation
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.supplemental_evidence.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        run: |
          python pit_retention_preparation.py prepare --latest --daily
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('data/pit_retention_preparation_v1/run_latest.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('generated='+str(r['generated_new_bundle']).lower()+'\n')
          PY
      - name: Save current PIT failure receipt including preparation timeout
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.pit_preparation.outcome == 'failure'
        continue-on-error: true
        run: python pit_retention_preparation.py record-failure
      - name: Persist data and diagnostics
        id: persist
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -c 'from publish_forward_evidence import validate_state; from direction_forward_v42 import ROOT; validate_state(ROOT)'
          python -c 'import paired_forward_cohort as p; p.guard(p.ROOT); p.history_guard(p.ROOT)'
          python -c 'import p2_paired_execution_v2 as p; p.guard(p.ROOT); p.history_guard(p.ROOT)'
          python -c 'import p2_paired_execution_v3_1 as p; p.guard(p.ROOT); p.history_guard(p.ROOT)'
          for f in data/hourly_research/ohlc.csv data/hourly_research/latest.json data/crash_research/pilot_1h_latest.json data/crash_research/prospective_hourly.csv data/crash_research/prospective_scores.json data/crash_research/v42_scores.json data/direction_v42/forward_registry.csv data/direction_v42/forward_scores.csv data/direction_v42/forward_latest.json data/stage5/minute_shadow/latest.json data/stage5/minute_shadow/minute_scores.csv data/stage5/error_review/latest.json data/stage5/spot_plus/quote_watch_latest.json data/stage5/forward_validation/latest.json data/stage5/forward_validation/remote_witnesses.csv data/stage5/forward_validation/verified_run_metadata.csv reports/DOGE_FORWARD_VALIDATION.md; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git add -f data/quote_evidence_v2
          for f in data/pit_retention_preparation_v1/latest.json data/pit_retention_preparation_v1/run_latest.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if [ -d data/forward_diagnostics_v1 ]; then git add -f data/forward_diagnostics_v1; fi
          if [ -f reports/DOGE_FORWARD_DIAGNOSTICS_V1.md ]; then git add -f reports/DOGE_FORWARD_DIAGNOSTICS_V1.md; fi
            if [ -d data/paired_forward_v1 ]; then git add -f data/paired_forward_v1; fi
            if [ -d data/minimal_market_forward_v1 ]; then git add -f data/minimal_market_forward_v1; fi
            if [ -d data/p2_economic_acceptance_v1 ]; then git add -f data/p2_economic_acceptance_v1; fi
          if [ -f reports/DOGE_PAIRED_SELECTIVE_SHADOW_V1.md ]; then git add -f reports/DOGE_PAIRED_SELECTIVE_SHADOW_V1.md; fi
          if [ -d data/p2_paired_execution_v2 ]; then git add -f data/p2_paired_execution_v2; fi
          if [ -f reports/DOGE_P2_PAIRED_EXECUTION_V2.md ]; then git add -f reports/DOGE_P2_PAIRED_EXECUTION_V2.md; fi
          if [ -d data/p2_paired_execution_v3_1 ]; then git add -f data/p2_paired_execution_v3_1; fi
          if [ -d data/p2_path_quality ]; then git add -f data/p2_path_quality; fi
          if [ -d data/p2_locked_forward_v1 ]; then git add -f data/p2_locked_forward_v1; fi
          if [ -d data/p1_regime_forward_v1 ]; then git add -f data/p1_regime_forward_v1; fi
          if [ -f reports/DOGE_P2_PAIRED_EXECUTION_V3_1.md ]; then git add -f reports/DOGE_P2_PAIRED_EXECUTION_V3_1.md; fi
          if [ -d data/derived_4h_v1 ]; then git add -f data/derived_4h_v1; fi
          if [ -d data/feature_ablation_v1 ]; then git add -f data/feature_ablation_v1; fi
          if [ -d data/p0_operations ]; then git add -f data/p0_operations; fi
          if [ -d data/hourly_publication_recovery_v1 ]; then git add -f data/hourly_publication_recovery_v1; fi
          for d in data/plus_evidence_v1_0/; do
            if [ -d "$d" ]; then git add -f "$d"; fi
          done
          if [ -f reports/DOGE_PLUS_EVIDENCE_V1_0.md ]; then git add -f reports/DOGE_PLUS_EVIDENCE_V1_0.md; fi
          for f in data/stage5/forward_validation_v2/latest.json data/stage5/forward_validation_v2/protocol_witness.json reports/DOGE_FORWARD_VALIDATION_V2.md; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: extend OKX 1H research history'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              [ "$attempt" -lt 5 ] || exit 1
              sleep 4
            done
          fi
      - name: Freeze archive bytes and continue single-writer capture during upload
        id: archive_bridge_start
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.persist.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python archive_capture_bridge.py start --snapshot archive-snapshot --control "$RUNNER_TEMP/doge-archive-bridge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve per-run forecast and score evidence snapshot
        id: artifact
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.archive_bridge_start.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: doge-forward-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            archive-snapshot/manifest.json
            archive-snapshot/data/direction_v42/forward_registry.csv
            archive-snapshot/data/direction_v42/forward_scores.csv
            archive-snapshot/data/stage5/*protocol.json
            archive-snapshot/data/stage5/pre_registration.json
            archive-snapshot/data/stage5/forward_validation/latest.json
            archive-snapshot/data/stage5/forward_validation/*.csv
            archive-snapshot/data/stage5/spot_plus/quote_watch_latest.json
            archive-snapshot/reports/DOGE_FORWARD_VALIDATION.md
            archive-snapshot/data/quote_evidence_v2/
            archive-snapshot/data/stage5/forward_validation_protocol_v2.json
            archive-snapshot/data/stage5/forward_validation_v2/
            archive-snapshot/reports/DOGE_FORWARD_VALIDATION_V2.md
            archive-snapshot/data/p0_operations/
            archive-snapshot/data/forward_diagnostics_v1/
            archive-snapshot/reports/DOGE_FORWARD_DIAGNOSTICS_V1.md
            archive-snapshot/data/paired_forward_v1/
            archive-snapshot/reports/DOGE_PAIRED_SELECTIVE_SHADOW_V1.md
            archive-snapshot/data/stage5/paired_selection_v1_protocol.json
            archive-snapshot/system/current_paired_shadow.json
            archive-snapshot/system/versions/DOGE_PAIRED_SELECTIVE_SHADOW_V1_20261012_1600.json
            archive-snapshot/data/p2_paired_execution_v2/
            archive-snapshot/reports/DOGE_P2_PAIRED_EXECUTION_V2.md
            archive-snapshot/data/stage5/p2_paired_execution_v2_protocol.json
            archive-snapshot/system/current_p2_execution_shadow.json
            archive-snapshot/system/versions/DOGE_P2_PAIRED_EXECUTION_V2_20261013_0000.json
            archive-snapshot/data/p2_paired_execution_v3_1/
            archive-snapshot/data/p2_path_quality/
            archive-snapshot/data/p2_locked_forward_v1/
            archive-snapshot/data/p1_regime_forward_v1/
            archive-snapshot/data/stage5/p1_regime_forward_v1_protocol.json
            archive-snapshot/data/stage5/p2_locked_forward_v1_protocol.json
            archive-snapshot/data/minimal_market_forward_v1/
            archive-snapshot/data/p2_economic_acceptance_v1/
            archive-snapshot/data/stage5/minimal_market_forward_v1_protocol.json
            archive-snapshot/system/versions/DOGE_MINIMAL_MARKET_FORWARD_V1_20261013_0300.json
            archive-snapshot/data/derived_4h_v1/
            archive-snapshot/data/feature_ablation_v1/
            archive-snapshot/data/enhancement_sources_v1/
            archive-snapshot/data/stage5/feature_ablation_v1_protocol.json
            archive-snapshot/system/versions/DOGE_FEATURE_ABLATION_V1_20261013_0200.json
            archive-snapshot/reports/DOGE_P2_PAIRED_EXECUTION_V3_1.md
            archive-snapshot/data/stage5/p2_paired_execution_v3_1_protocol.json
            archive-snapshot/system/current_p2_execution_shadow_v3_1.json
            archive-snapshot/system/versions/DOGE_P2_PAIRED_EXECUTION_V3_1_20261013_0000.json
      - name: Preserve new-version evidence separately from frozen forecast artifacts
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.archive_bridge_start.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: doge-plus-evidence-v1-0-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            archive-snapshot/manifest.json
            archive-snapshot/publication-refresh-output/
            archive-snapshot/data/plus_evidence_v1_0/
            archive-snapshot/system/versions/DOGE_PLUS_EVIDENCE_V1_0_20261012.json
            archive-snapshot/system/current_plus_evidence.json
            archive-snapshot/reports/DOGE_PLUS_EVIDENCE_V1_0.md
      - name: Preserve newly prepared daily PIT package without claiming WORM
        id: pit_artifact
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.archive_bridge_start.outcome == 'success' && steps.pit_preparation.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: doge-pit-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            archive-snapshot/data/pit_retention_preparation_v1/
      - name: Drain archive capture before any subsequent writer or alert
        id: archive_bridge_stop
        if: always() && steps.archive_bridge_start.outcome == 'success'
        timeout-minutes: 9
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python archive_capture_bridge.py stop --snapshot archive-snapshot --control "$RUNNER_TEMP/doge-archive-bridge-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Record successful daily package upload only after artifact success
        id: pit_publication
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.archive_bridge_stop.outcome == 'success' && steps.pit_artifact.outcome == 'success' && steps.pit_preparation.outputs.generated == 'true'
        continue-on-error: true
        env:
          PIT_ARTIFACT_ID: ${{ steps.pit_artifact.outputs.artifact-id }}
          PIT_ARTIFACT_DIGEST: ${{ steps.pit_artifact.outputs.artifact-digest }}
        run: |
          python pit_retention_preparation.py record-artifact --artifact-id "$PIT_ARTIFACT_ID" --artifact-digest "$PIT_ARTIFACT_DIGEST" --run-id "$GITHUB_RUN_ID"
          python pit_artifact_publication.py
      - name: Preserve capture receipts produced during archive upload
        if: always() && steps.archive_bridge_start.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: doge-archive-capture-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            data/runtime_deadline_v1/
            archive-snapshot/manifest.json
            ${{ runner.temp }}/doge-archive-bridge-${{ github.run_id }}-${{ github.run_attempt }}/
      - name: Fail visibly on archive bridge or snapshot error
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.archive_bridge_start.outcome != 'success' || steps.archive_bridge_stop.outcome != 'success')
        run: exit 1
      - name: Fail visibly on PIT preparation or package artifact error after saving core evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.pit_preparation.outcome == 'failure' || steps.pit_artifact.outcome == 'failure' || steps.pit_publication.outcome == 'failure')
        run: exit 1
      - name: Fail visibly on supplemental capture failure after preserving core evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.supplemental_evidence.outcome != 'success'
        run: exit 1
      - name: Fail visibly on open target guard or diagnostic errors after saving evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.open_target_guard.outcome == 'failure' || steps.diagnostics.outcome == 'failure')
        run: exit 1
      - name: Fail visibly on paired cohort audit error after saving original evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.paired_audit.outcome == 'failure' || steps.paired_smoke.outcome == 'failure')
        run: exit 1
      - name: Fail visibly on independent P2 execution or verification errors after evidence is saved
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.p2_execution.outcome == 'failure' || steps.p2_execution_smoke.outcome == 'failure' || steps.p2_execution_tests.outcome != 'success')
        run: exit 1
      - name: Fail visibly on repaired V3 P2 errors after saving evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.p2_execution_v3.outcome == 'failure' || steps.p2_execution_v3_smoke.outcome == 'failure' || steps.p2_execution_v3_tests.outcome != 'success' || steps.p2_path.outcome == 'failure' || steps.locked_forward_cohort.outcome == 'failure')
        run: exit 1
      - name: Fail visibly on enhancement errors after preserving original evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.feature_prepare.outcome == 'failure' || steps.feature_bind.outcome == 'failure' || steps.feature_publication.outcome == 'failure' || steps.feature_audit.outcome == 'failure')
        run: exit 1
      - name: Fail visibly on independent minimal market errors after saving evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.minimal_prepare.outcome == 'failure' || steps.minimal_bind.outcome == 'failure' || steps.minimal_publication.outcome == 'failure' || steps.minimal_audit.outcome == 'failure')
        run: exit 1
      - name: Fail visibly on optional source refresh after preserving core publication and artifacts
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.early_publish.outputs.hourly_source_failed == 'true' && (steps.hourly_source_recovery.outcome != 'success' || steps.hourly_source_recovery.outputs.recovered != 'true')
        run: exit 1
      - name: Fail on deadline service error after preserving evidence
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && steps.deadline_service.outcome != 'success'
        run: exit 1
      - name: Fail on collector or quality error
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false' && (steps.validation.outcome != 'success' || steps.quote_watch.outcome != 'success' || steps.fast_hourly.outcome != 'success' || steps.collect.outcome != 'success' || steps.evaluate.outcome != 'success' || steps.forward.outcome != 'success' || steps.v42.outcome != 'success' || (steps.direction.outcome != 'success' && steps.direction_late_audit.outcome != 'success') || steps.minute_shadow.outcome != 'success' || steps.error_review.outcome != 'success' || steps.regression.outcome != 'success' || steps.early_publish.outcome != 'success' || steps.operations.outcome != 'success' || steps.persist.outcome != 'success' || steps.artifact.outcome != 'success' || steps.public_witness.outcome == 'failure')
        run: exit 1
      - name: Alert existing P0 issue on failed execution or newly closed missing slot
        if: always() && steps.deadline_service.outputs.fatal == 'false' && steps.open_target_guard.outputs.tail_fatal == 'false'
        uses: actions/github-script@v7
        env:
          JOB_FAILED: ${{ job.status == 'failure' }}
        with:
          script: |
            const fs = require('fs');
            let report = null;
            try { report = JSON.parse(fs.readFileSync('data/p0_operations/latest.json', 'utf8')); } catch {}
            const notify = require('./.github/scripts/p0_alert.cjs');
            const result = await notify({github, context, report, failed:process.env.JOB_FAILED === 'true'});
            core.info(JSON.stringify(result));
