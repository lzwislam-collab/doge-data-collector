name: Backfill DOGE BTC ETH 1H extreme-event research history
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'okx_hourly_research_history.py'
      - 'evaluate_crash_warning.py'
      - 'crash_forward_watch.py'
      - 'test_crash_forward_watch.py'
      - 'crash_v42_score.py'
      - 'direction_forward_v42.py'
      - 'test_direction_forward_v42.py'
      - 'stage5_minute_shadow.py'
      - 'test_stage5_minute_shadow.py'
      - 'stage5_error_review.py'
      - 'test_stage5_error_review.py'
      - 'spot_plus_quote_watch.py'
      - 'forward_validation.py'
      - 'forward_validation_v2.py'
      - 'quote_evidence_v2.py'
      - 'test_forward_validation_v2.py'
      - 'test_quote_evidence_v2.py'
      - 'data/stage5/forward_validation_protocol_v2.json'
      - 'test_forward_validation.py'
      - 'data/stage5/forward_validation_protocol.json'
      - 'test_spot_plus_quote_watch.py'
      - 'data/stage5/minute_evaluation_protocol.json'
      - 'test_crash_v42_score.py'
      - '.github/workflows/okx_hourly_extreme_history.yml'
  schedule:
    - cron: '13,33,53 * * * *' # same existing workflow: extra quote-scoring polls; hourly forecasts unchanged
permissions:
  contents: write
  actions: read
concurrency:
  group: okx-hourly-extreme-history # shared with daily audit and short raw-quote job; long scans are separate
  cancel-in-progress: false
jobs:
  hourly-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test hourly point-in-time registry causal restrictions
        run: python -m unittest -v test_crash_forward_watch test_crash_v42_score test_direction_forward_v42 test_stage5_minute_shadow test_stage5_error_review test_spot_plus_quote_watch test_forward_validation test_quote_evidence_v2 test_forward_validation_v2
      - name: Fail closed before writes on full-history or frozen protocol mutation
        run: python forward_validation_v2.py --integrity-only
      - name: Score genuine due target quotes before long collection steps
        id: quote_watch
        continue-on-error: true
        run: python quote_evidence_v2.py watch
      - name: Backfill confirmed UTC 1H data with source-ingestion timestamps
        id: collect
        continue-on-error: true
        run: |
          hour=$(date -u +%H)
          if [ "$hour" = "03" ] || [ "$hour" = "15" ]; then export DOGE_HOURLY_PAGE_BUDGET=24; else export DOGE_HOURLY_PAGE_BUDGET=0; fi
          python okx_hourly_research_history.py
      - name: Evaluate hourly extreme-down alert precision and recall
        id: evaluate
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python evaluate_crash_warning.py
      - name: Register genuinely prospective hourly risk checkpoint and score matured alerts
        id: forward
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python crash_forward_watch.py
      - name: V4.2 forward-only one-hour-lead risk scoring
        id: v42
        if: steps.forward.outcome == 'success'
        continue-on-error: true
        run: python crash_v42_score.py
      - name: Issue and score DOGE UP/DOWN shadow forecasts from live ticker quote
        id: direction
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python quote_evidence_v2.py direction
      - name: Verify benign late-registration skip without changing frozen deadline
        id: direction_late_audit
        if: steps.direction.outcome != 'success' && steps.collect.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('data/direction_v42/forward_latest.json').read_text())
          assert report.get('status')=='stale_hour_no_new_registration', 'direction error is not benign lateness'
          assert report.get('feature_lag_min',0)>45, 'cannot waive timely forecast errors'
          assert report.get('new_ids')==[], 'late forecast must never register new predictions'
          print('LATE_BUT_SAFE: no forecast backdated; scoring proceeds independently')
          PY
      - name: Independently score target outcomes using confirmed OKX 1m bars
        id: minute_shadow
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python stage5_minute_shadow.py
      - name: Review DOGE direction errors, source gaps and market co-movement without modifying frozen forecasts
        id: error_review
        if: steps.collect.outcome == 'success'
        continue-on-error: true
        run: python stage5_error_review.py
      - name: Audit original quotes, publication receipts, baselines and prospective spot paper
        id: validation
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python forward_validation_v2.py
      - name: Persist data and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/hourly_research/ohlc.csv data/hourly_research/latest.json data/crash_research/pilot_1h_latest.json data/crash_research/prospective_hourly.csv data/crash_research/prospective_scores.json data/crash_research/v42_scores.json data/direction_v42/forward_registry.csv data/direction_v42/forward_scores.csv data/direction_v42/forward_latest.json data/stage5/minute_shadow/latest.json data/stage5/minute_shadow/minute_scores.csv data/stage5/error_review/latest.json data/stage5/spot_plus/quote_watch_latest.json data/stage5/forward_validation/latest.json data/stage5/forward_validation/remote_witnesses.csv data/stage5/forward_validation/verified_run_metadata.csv reports/DOGE_FORWARD_VALIDATION.md; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git add -f data/quote_evidence_v2
          for f in data/stage5/forward_validation_v2/latest.json data/stage5/forward_validation_v2/protocol_witness.json reports/DOGE_FORWARD_VALIDATION_V2.md; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: extend OKX 1H research history'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              [ "$attempt" -lt 5 ] || exit 1
              sleep 4
            done
          fi
      - name: Preserve per-run forecast and score evidence snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doge-forward-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            data/direction_v42/forward_registry.csv
            data/direction_v42/forward_scores.csv
            data/stage5/*protocol.json
            data/stage5/pre_registration.json
            data/stage5/forward_validation/latest.json
            data/stage5/forward_validation/*.csv
            data/stage5/spot_plus/quote_watch_latest.json
            reports/DOGE_FORWARD_VALIDATION.md
            data/quote_evidence_v2/
            data/stage5/forward_validation_protocol_v2.json
            data/stage5/forward_validation_v2/
            reports/DOGE_FORWARD_VALIDATION_V2.md
      - name: Fail on collector or quality error
        if: steps.validation.outcome != 'success' || steps.quote_watch.outcome != 'success' || steps.collect.outcome != 'success' || steps.evaluate.outcome != 'success' || steps.forward.outcome != 'success' || steps.v42.outcome != 'success' || (steps.direction.outcome != 'success' && steps.direction_late_audit.outcome != 'success') || steps.minute_shadow.outcome != 'success' || steps.error_review.outcome != 'success'
        run: exit 1
