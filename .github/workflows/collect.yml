
name: Collect OKX public market data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: doge-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect and validate market data
        run: python collector.py

      - name: Capture isolated official derivatives PIT evidence
        id: derivative_pit
        continue-on-error: true
        run: python derivatives_pit_v1.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/hourly.csv
          if [ -d data/derivatives_pit_v1 ]; then git add -f data/derivatives_pit_v1; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: update OKX market snapshot"
            git push
          else
            echo "No data changes"
          fi

      - name: Report incomplete derivatives source separately
        if: steps.derivative_pit.outcome != 'success'
        run: exit 1
