
name: Collect OKX public market data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: doge-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect and validate market data
        run: python collector.py

      - name: Capture isolated official derivatives PIT evidence
        id: derivative_pit
        continue-on-error: true
        run: python derivatives_pit_v1.py

      - name: Commit updated data
        run: python collector_publication_v2.py

      - name: Preserve first captured bytes even if main publication fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collector-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/derivatives_pit_v1/
            data/latest.json
            data/hourly.csv
          if-no-files-found: error
          retention-days: 90

      - name: Report incomplete derivatives source separately
        if: steps.derivative_pit.outcome != 'success'
        run: exit 1
