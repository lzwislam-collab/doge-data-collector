name: Collect US macro indicators
on:
  workflow_dispatch:
  schedule:
    - cron: '27 3,15 * * *'
  push:
    branches: [main]
    paths:
      - 'macro_collector.py'
      - 'source_publication.py'
      - '.github/workflows/macro.yml'
permissions:
  contents: write
concurrency:
  group: doge-macro-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          sparse-checkout: |
            data/macro
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official FRED series and audit
        id: collector
        continue-on-error: true
        run: python macro_collector.py
      - name: Publish source files and verify remote bytes
        if: always()
        env:
          SOURCE_COLLECTION_OUTCOME: ${{ steps.collector.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python source_publication.py --source macro
      - name: Propagate collection failure
        if: steps.collector.outcome != 'success'
        run: exit 1
      - name: Preserve source failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-5-macro-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: data/macro/
