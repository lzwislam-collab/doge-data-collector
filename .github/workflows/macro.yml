name: Collect US macro indicators
on:
  workflow_dispatch:
  # Lean-v1.0: historical data retained; auto collection paused until prospective incremental value is proven.
permissions:
  contents: write
concurrency:
  group: doge-macro-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download official FRED series and audit
        id: collector
        continue-on-error: true
        run: python macro_collector.py
      - name: Store observations, revisions and errors
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/macro/latest.json data/macro/observations.csv data/macro/revisions.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: update US macro economic indicators'
            for n in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$n" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Propagate collection failure
        if: steps.collector.outcome != 'success'
        run: exit 1
