name: Sample DOGE whale events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/whale.yml'
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: write

concurrency:
  group: doge-whale-sampling
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WHALE_LISTEN_SECONDS: '480'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample DOGE stream
        id: collector
        continue-on-error: true
        run: python doge_whale.py
      - name: Publish observations and diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/whales/events.csv data/whales/latest.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: sample DOGE whale stream'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Report sampling failure
        if: steps.collector.outcome != 'success'
        run: exit 1
