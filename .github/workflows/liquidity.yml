name: Collect DOGE swap liquidity

on:
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
  push:
    branches: [main]
    paths:
      - 'doge_liquidity.py'
      - 'source_publication.py'
      - '.github/workflows/liquidity.yml'

permissions:
  contents: write

concurrency:
  group: doge-liquidity-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          sparse-checkout: |
            data/liquidity
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect public OKX swap liquidity
        id: scanner
        continue-on-error: true
        run: python doge_liquidity.py
      - name: Publish source files and verify remote bytes
        if: always()
        env:
          SOURCE_COLLECTION_OUTCOME: ${{ steps.scanner.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python source_publication.py --source liquidity
      - name: Report collection failure
        if: steps.scanner.outcome != 'success'
        run: exit 1
      - name: Preserve source failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-5-liquidity-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: data/liquidity/
