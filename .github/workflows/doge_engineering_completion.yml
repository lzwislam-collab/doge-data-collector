name: Audit DOGE collector terminal execution
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [audit, bridge]
        default: audit
      source_audit_run_id:
        type: string
        default: ''
      source_audit_attempt:
        type: string
        default: ''
      source_audit_head:
        type: string
        default: ''
      source_audit_blob:
        type: string
        default: ''
      source_audit_kind:
        type: choice
        options: [legacy, r2]
        default: legacy
  push:
    branches: [main, 'audit/forward-readiness-*']
    paths: ['forward_readiness.py', 'test_forward_readiness.py', '.github/workflows/doge_engineering_completion.yml']
  pull_request:
    paths: ['forward_readiness.py', 'test_forward_readiness.py', '.github/workflows/doge_engineering_completion.yml']
  workflow_run:
    workflows: ['Backfill DOGE BTC ETH 1H extreme-event research history', 'Collect OKX public market data', 'Sample free Bybit DOGE liquidation events', 'Sample free Binance DOGE liquidation snapshots', 'Audit DOGE V2 R2 frozen forward registration', 'Audit future learned DOGE shadow candidate registration', 'Audit DOGE R2 engineering transport v1']
    types: [completed]
permissions:
  contents: read
  actions: write
concurrency:
  group: doge-readiness-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terminal-receipt:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - name: Test readiness monitoring and bounded trusted dispatch
        run: python -m unittest test_forward_readiness test_market_snapshot_recovery test_learned_audit_handoff -q
      - name: Verify explicitly handed off audit completion and unchanged current source
        id: source_audit
        if: github.event_name == 'workflow_dispatch' && inputs.source_audit_run_id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_AUDIT_RUN_ID: ${{ inputs.source_audit_run_id }}
          SOURCE_AUDIT_ATTEMPT: ${{ inputs.source_audit_attempt }}
          SOURCE_AUDIT_HEAD: ${{ inputs.source_audit_head }}
          SOURCE_AUDIT_BLOB: ${{ inputs.source_audit_blob }}
          SOURCE_AUDIT_KIND: ${{ inputs.source_audit_kind }}
        run: python -B learned_audit_handoff.py verify
      - name: Recover stale required market snapshot from trusted hourly completion
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_run' && (github.event.workflow_run.path == '.github/workflows/okx_hourly_extreme_history.yml' || startsWith(github.event.workflow_run.path, '.github/workflows/okx_hourly_extreme_history.yml@'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python market_snapshot_recovery.py
      - name: Record terminal status and missing evidence without historical reconstruction
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Backfill DOGE BTC ETH 1H extreme-event research history'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python engineering_run_receipt.py
      - name: Actual-clock readiness and explicit original publisher bridge
        id: readiness
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READINESS_MODE: ${{ steps.source_audit.outputs.readiness_mode || (github.event_name == 'workflow_run' && 'bridge' || inputs.mode || 'audit') }}
        run: python r2_engineering_readiness.py "$READINESS_MODE"
      - name: Preserve independent completion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doge-readiness-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            engineering_completion_receipt.json
            forward-readiness-output/
      - name: Fail visibly on current errors after preserving historical gaps
        if: steps.readiness.outcome == 'success' && steps.readiness.outputs.has_runtime_errors != 'false'
        run: exit 1
