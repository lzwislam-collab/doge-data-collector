name: Test prospective evidence and spot paper accounting
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'runtime_deadline_service.py'
      - 'runtime_publication_profile.py'
      - 'git_history_batch_probe.py'
      - 'test_git_history_batch_probe.py'
      - 'test_runtime_publication*.py'
      - 'pit_retention_preparation.py'
      - 'test_pit_retention_preparation.py'
      - 'test_pit_retention_daily.py'
      - 'feature_publication_gate.py'
      - 'publication_recovery.py'
      - 'engineering_run_receipt.py'
      - 'direction_lateness_gate.py'
      - 'test_engineering_closure.py'
      - '.github/workflows/doge_engineering_completion.yml'
      - 'test_feature_publication_gate.py'
      - 'forward_validation.py'
      - 'minimal_market_candidate.py'
      - 'minimal_market_forward.py'
      - 'p2_economic_acceptance.py'
      - 'test_minimal_market*.py'
      - 'test_p2_economic_acceptance.py'
      - 'test_audited_forward_refresh.py'
      - 'data/stage5/minimal_market_forward_v1_protocol.json'
      - 'system/versions/DOGE_MINIMAL_MARKET_FORWARD_V1_20261013_0300.json'
      - 'forward_validation_v2.py'
      - 'quote_evidence_v2.py'
      - 'test_forward_validation_v2.py'
      - 'test_quote_evidence_v2.py'
      - 'data/stage5/forward_validation_protocol_v2.json'
      - 'test_forward_validation.py'
      - 'quote_capture_retry.py'
      - 'p0_operational_audit.py'
      - 'publish_forward_evidence.py'
      - 'test_p0_operations.py'
      - 'test_publish_forward_evidence.py'
      - 'data/stage5/forward_validation_protocol.json'
      - '.github/workflows/test_forward_validation.yml'
      - '.github/workflows/okx_hourly_extreme_history.yml'
      - '.github/workflows/prediction_gate.yml'
      - '.github/workflows/liquidations.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # preserve full regression/integrity plus bounded publication diagnostics
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full regression suite including frozen factor review
        run: |
          python -m pip install numpy==2.3.5 oss2==2.19.1 aliyun-python-sdk-core==2.16.1
          python -m unittest discover -v
      - run: python minimal_market_forward.py prepare
      - run: python forward_validation_v2.py --integrity-only
      - name: Compare native Git patch bytes after original frozen validation
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/archive-qualified-drain-failure-20261026'
        timeout-minutes: 8
        run: |
          python runtime_publication_profile.py --source-sha 64d43e642804b1622dbd84f5fbc09258e3a26ced --output "$RUNNER_TEMP/runtime-publication-profile.json" --timeout-seconds 360 --history-batch-experiment
      - name: Preserve bounded publication diagnostics
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/archive-qualified-drain-failure-20261026'
        uses: actions/upload-artifact@v4
        with:
          name: publication-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-publication-profile.json
          if-no-files-found: error
          retention-days: 7
