name: Verify DOGE liquidation events
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: doge-liquidation-events
  cancel-in-progress: false
jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install WebSocket client
        run: python -m pip install 'websocket-client==1.8.0'
      - name: Sample OKX liquidation events
        id: scan
        continue-on-error: true
        env:
          LIQ_LISTEN_SECONDS: '480'
        run: python doge_liquidations.py
      - name: Publish observations and errors
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in data/liquidations/latest.json data/liquidations/events.csv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m 'data: verify observed DOGE liquidations'
            for i in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then break; fi
              if [ "$i" = 3 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Report scanner failure
        if: steps.scan.outcome != 'success'
        run: exit 1
