name: Collect BTC ETH spot ETF flows
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5,13,21 * * 1-6'
  push:
    branches: [main]
    paths:
      - 'etf_flows.py'
      - 'source_publication.py'
      - '.github/workflows/etf_flows.yml'
permissions:
  contents: write
concurrency:
  group: doge-etf-flow-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
          sparse-checkout: |
            data/etf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HTML parser
        run: python -m pip install 'beautifulsoup4==4.12.3'
      - name: Fetch Farside BTC ETH ETF flows
        id: collector
        continue-on-error: true
        run: python etf_flows.py
      - name: Publish source files and verify remote bytes
        if: always()
        env:
          SOURCE_COLLECTION_OUTCOME: ${{ steps.collector.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python source_publication.py --source etf
      - name: Fail if ETF collection failed
        if: steps.collector.outcome != 'success'
        run: exit 1
      - name: Preserve source failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-5-etf-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: data/etf/
