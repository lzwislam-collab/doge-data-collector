name: Audit factor eligibility and official derivatives PIT
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'factor_eligibility_v1.py'
      - 'derivatives_pit_v1.py'
      - 'test_factor_eligibility_v1.py'
      - 'config/factor_eligibility_v1.json'
      - '.github/workflows/factor_eligibility_v1.yml'
      - '.github/workflows/collect.yml'
  push:
    branches: [main]
    paths:
      - 'factor_eligibility_v1.py'
      - 'derivatives_pit_v1.py'
      - 'test_factor_eligibility_v1.py'
      - 'config/factor_eligibility_v1.json'
      - '.github/workflows/factor_eligibility_v1.yml'
permissions:
  contents: read
concurrency:
  group: doge-factor-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run complete regression suite
        run: python -m unittest discover -q
      - name: Verify frozen production blobs and actual catalog identity
        run: |
          python - <<'PY'
          import csv, hashlib, json, subprocess
          from pathlib import Path
          p=json.loads(Path('data/stage5/forward_validation_protocol_v2.json').read_bytes())
          for f,expected in p['locked_code_git_blobs'].items():
              assert subprocess.check_output(['git','hash-object',f],text=True).strip()==expected,f
          c=json.loads(Path('config/factor_eligibility_v1.json').read_bytes())
          raw=Path(c['catalog_path']).read_bytes()
          assert hashlib.sha256(raw).hexdigest()==c['catalog_sha256']
          with Path(c['catalog_path']).open(encoding='utf-8-sig',newline='') as f: rows=list(csv.DictReader(f))
          assert len(rows)==36 and all(r['Legacy item']==v['item'] and int(r['Source36#'])==v['id'] for r,v in zip(rows,c['legacy36']))
          assert all(v['new_production_feature_allowed'] is False for v in c['features'])
          PY
  capture:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
    concurrency:
      group: doge-data-collector
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Capture actual public OI and funding responses
        id: capture
        continue-on-error: true
        run: python derivatives_pit_v1.py
      - name: Replay archive and persist evidence only
        if: always()
        run: |
          python -c 'import derivatives_pit_v1 as d; print("raw_replay_rows", len(d.read()))'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -d data/derivatives_pit_v1 ]; then git add -f data/derivatives_pit_v1; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: capture official derivative PIT raw receipts'
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 3
            done
          fi
      - name: Fail on incomplete capture without inventing missing values
        if: steps.capture.outcome != 'success'
        run: exit 1
