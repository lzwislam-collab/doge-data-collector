name: Independently review DOGE R2 competition and paper rollback
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Routine diagnostic or complete server replay for fixed review
        type: choice
        options: [routine, batch, full]
        default: routine
      registration_run_id:
        description: Optional original successful main registration locator, reread from GitHub
        required: false
        default: ''
      batch_index:
        description: Bounded 20-event batch index, 0 through 63
        required: false
        default: '0'
      batch_run_ids:
        description: Successful main batch run IDs for complete aggregation, comma separated
        required: false
        default: ''
  push:
    branches: [main, 'research/phase3-*']
    paths: ['phase3_*.py', 'test_phase3_*.py', 'config/phase3_*.json', 'system/phase3_*.json', '.github/workflows/phase3_independent.yml']
  pull_request:
    paths: ['phase3_*.py', 'test_phase3_*.py', 'config/phase3_*.json', 'system/phase3_*.json', '.github/workflows/phase3_independent.yml']
  workflow_run:
    workflows: ['Publish DOGE V2 R2 frozen forward evidence']
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: phase3-independent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  independent:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 scipy==1.16.3 scikit-learn==1.7.2 joblib==1.5.2 threadpoolctl==3.6.0 botocore==1.43.112
      - name: Full tests and original frozen history
        if: github.event_name != 'workflow_run'
        run: |
          python -m unittest discover -q
          python forward_validation_v2.py --integrity-only
      - name: Read-only independent replay and assessment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ASSESSMENT_MODE: ${{ inputs.mode || 'routine' }}
          PHASE3_REGISTRATION_RUN_ID: ${{ inputs.registration_run_id || '' }}
          PHASE3_BATCH_INDEX: ${{ inputs.batch_index || '0' }}
          PHASE3_BATCH_RUN_IDS: ${{ inputs.batch_run_ids || '' }}
        run: python phase3_runtime.py "$ASSESSMENT_MODE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase3-independent-${{ github.run_id }}
          path: |
            phase3-independent-output/
            config/phase3_independent_v1.json
            config/phase3_registration_v1.json
            system/phase3_candidates_v1.json
          if-no-files-found: error
          retention-days: 90
