permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 oss2==2.19.1 aliyun-python-sdk-core==2.16.1 PyYAML==6.0.2
      - name: Compare complete cold guards before and after local history indexing
        timeout-minutes: 5
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          import hashlib, json, os, sys, time
          from pathlib import Path
          import yaml
          import runtime_process
          from runtime_deadline_service import COMMAND_TIMEOUT_SECONDS
          from runtime_history_graph import prepare
          root = Path.cwd()
          for path in ('.github/workflows/doge_history.yml',
                       '.github/workflows/okx_hourly_extreme_history.yml',
                       '.github/workflows/runtime_deadline_tests.yml'):
              document = yaml.load(Path(path).read_text(), Loader=yaml.BaseLoader)
              assert isinstance(document, dict) and document.get('on') and document.get('jobs'), path
              print('WORKFLOW_YAML_PARSED', path, flush=True)
          def git(*args):
              return runtime_process.command(('git', *args), cwd=root, timeout=30)
          def snapshot():
              return {'head':git('rev-parse','HEAD').strip(),
                      'refs_sha256':hashlib.sha256(git('for-each-ref','--format=%(refname) %(objectname)').encode()).hexdigest(),
                      'tracked_status_sha256':hashlib.sha256(git('status','--porcelain','--untracked-files=no').encode()).hexdigest(),
                      'tracked_diff_sha256':hashlib.sha256(git('diff','--binary','HEAD','--').encode()).hexdigest()}
          code = """import json,time
          from pathlib import Path
          from runtime_forward_bridge import validate_original18,_checked_bundle,_BUNDLE_CACHE
          assert not _BUNDLE_CACHE
          started=time.monotonic()
          _checked_bundle(Path('.'))
          model=time.monotonic()-started
          result=validate_original18(Path('.'))
          total=time.monotonic()-started
          print(json.dumps({'result':result,'cold_seconds':total,'model_checked_seconds':model,'journal_guard_seconds':total-model},sort_keys=True))
          """
          def cold(label, disable_index=False):
              child_env = dict(os.environ)
              if disable_index:
                  count = int(child_env.get('GIT_CONFIG_COUNT') or '0')
                  child_env.update({'GIT_CONFIG_COUNT':str(count+1),
                      'GIT_CONFIG_KEY_'+str(count):'core.commitGraph',
                      'GIT_CONFIG_VALUE_'+str(count):'false'})
                  assert runtime_process.command(('git','config','--type=bool','--get','core.commitGraph'),
                      cwd=root,env=child_env,timeout=30).strip() == 'false'
              output = runtime_process.command((sys.executable,'-c',code),cwd=root,
                  env=child_env,timeout=COMMAND_TIMEOUT_SECONDS)
              result = json.loads(output.strip().splitlines()[-1])
              assert result['result']['status']=='ORIGINAL18_LOCAL_APPEND_ONLY_VALIDATED', result
              print(json.dumps({'phase':label,**result},sort_keys=True),flush=True)
              return result
          before_snapshot = snapshot()
          before = cold('complete_guard_index_disabled_control', disable_index=True)
          index = prepare(root)
          after = cold('complete_guard_verified_native_index')
          assert before['result'] == after['result'], (before,after)
          assert snapshot() == before_snapshot, 'tracked source, HEAD or refs changed'
          assert after['cold_seconds'] < 20, after
          assert after['cold_seconds'] < before['cold_seconds'] * 0.5, (before,after)
          print(json.dumps({'status':'LOCAL_HISTORY_INDEX_FULL_GUARD_VERIFIED',
              'head':before_snapshot['head'],'before':before,'after':after,'index':index,
              'all_original_checks_retained':True,'source_head_refs_unchanged':True,
              'natural_cycle_cadence_verified':False},sort_keys=True))
          PY
      - name: Run regression tests
        env:
          NATIVE_TRANSPORT_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 101 && github.head_ref == 'fix/archive-audit-native-transport-20261110' }}
        run: |
          # This PR also requires the unchanged complete scientific-evidence suite.
          # Avoid repeating that suite before the isolated six-CLI comparison.
          if [ "$NATIVE_TRANSPORT_PR" = 'true' ]; then
            python -m unittest -q test_runtime_audit_cli test_runtime_history_prefix_transport test_runtime_audit_pipeline_profile test_runtime_canonical_walk test_runtime_p0_inventory_transport test_runtime_p0_launcher test_runtime_p0_profile_receipt test_runtime_paired_git_stream test_runtime_paired_stream_launcher test_runtime_paired_stream_receipt
          else
            python -m unittest discover -q
          fi
      - run: python forward_validation_v2.py --integrity-only

      - name: Run original source audits in the isolated pinned checkout
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/archive-qualified-drain-failure-20261026'
        timeout-minutes: 11
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - "$RUNNER_TEMP/runtime-source-audit-before.json" <<'PY'
          import hashlib, json, subprocess, sys
          from pathlib import Path
          import runtime_audit_worker as worker
          root = Path.cwd()
          state = {'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'tracked_status_sha256':hashlib.sha256(subprocess.check_output(
                  ['git','status','--porcelain','--untracked-files=no'])).hexdigest(),
              'files':{p:hashlib.sha256((root/p).read_bytes()).hexdigest()
                  if (root/p).exists() else None for p in worker.INPUTS+worker.OUTPUTS+
                  ('runtime_audit_worker.py','runtime_process.py')}}
          Path(sys.argv[1]).write_text(json.dumps(state), encoding='utf-8')
          PY
          timeout --signal=TERM --kill-after=10s 600s python runtime_audit_worker.py "$GITHUB_WORKSPACE" 25a7c2381855428b1487a86e6fa58c4c07e00357 "$RUNNER_TEMP/runtime-source-audit-result.json"
          python - "$RUNNER_TEMP/runtime-source-audit-result.json" "$RUNNER_TEMP/runtime-source-audit-before.json" <<'PY'
          import hashlib
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path
          import runtime_audit_worker as worker
          pinned = '25a7c2381855428b1487a86e6fa58c4c07e00357'
          result = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          root = Path.cwd()
          before = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          after = {'head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              'tracked_status_sha256':hashlib.sha256(subprocess.check_output(
                  ['git','status','--porcelain','--untracked-files=no'])).hexdigest(),
              'files':{p:hashlib.sha256((root/p).read_bytes()).hexdigest()
                  if (root/p).exists() else None for p in worker.INPUTS+worker.OUTPUTS+
                  ('runtime_audit_worker.py','runtime_process.py')}}
          assert after == before, 'source checkout changed during the isolated audit'
          if result.get('status') != 'ok':
              raise ValueError('original isolated source audit failed: '+str(result.get('error'))[:500])
          assert result['input_head'] == pinned
          assert result['checkout']['mode'] == 'sparse_source_archive_excluded'
          assert result['checkout']['exclude_source_archive'] is True
          assert [item['stage'] for item in result['timings']] == list(worker.SCRIPTS)
          expected = {path: hashlib.sha256(subprocess.check_output(
              ['git', 'show', pinned+':'+path])).hexdigest() for path in worker.INPUTS}
          assert result['inputs'] == expected
          assert set(result['outputs']) == set(worker.OUTPUTS)
          reports = {path: json.loads(body) for path, body in result['outputs'].items()}
          assert all(report.get('status') == 'ok' for report in reports.values())
          operations, paired = (reports[path] for path in worker.OUTPUTS)
          assert operations['input_head'] == pinned
          assert paired['source_p0_cutoff_utc'] == operations['audited_at_utc']
          assert paired['input_registry_sha256'] == expected[worker.INPUTS[0]]
          now = datetime.now(timezone.utc)
          for value in (operations['audited_at_utc'], paired['evaluated_at_utc']):
              stamp = datetime.fromisoformat(value.replace('Z', '+00:00'))
              assert stamp.tzinfo is not None
              assert 0 <= (now-stamp).total_seconds() <= 900
          print(json.dumps({'status':'verified_original_source_audits',
              'input_head':pinned, 'inputs':expected, 'checkout':result['checkout'],
              'timings':result['timings'], 'report_statuses':{
                  path:report['status'] for path,report in reports.items()},
              'worker_sha256':hashlib.sha256(Path(worker.__file__).read_bytes()).hexdigest(),
              'process_helper_sha256':hashlib.sha256(Path(worker.runtime_process.__file__).read_bytes()).hexdigest(),
              'source_head_status_inputs_and_reports_unchanged':True}, sort_keys=True))
          PY
      - name: Preserve isolated source audit validation
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/archive-qualified-drain-failure-20261026'
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/runtime-source-audit-result.json
            ${{ runner.temp }}/runtime-source-audit-before.json
          if-no-files-found: warn
          retention-days: 7



      - name: Compare whole original audit CLIs with native history transport
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/archive-audit-native-transport-20261110'
        timeout-minutes: 11
        env:
          DOGE_AUDIT_PAIRED_CPU_PROFILE: '0'
          DOGE_AUDIT_PAIRED_COMPONENT_PROFILE: '0'
          GITHUB_TOKEN: ${{ github.token }}
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -B runtime_audit_pipeline_profile.py --source-root "$GITHUB_WORKSPACE" --ref "$GITHUB_SHA" --output "$RUNNER_TEMP/source-audit-native-profile"
      - name: Preserve whole audit CLI comparison
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'fix/archive-audit-native-transport-20261110'
        uses: actions/upload-artifact@v4
        with:
          name: source-audit-native-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-audit-native-profile/
          if-no-files-found: error
          retention-days: 7
