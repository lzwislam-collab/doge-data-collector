name: Runtime deadline repair regression
on:
  pull_request:
    paths:
      - 'runtime_deadline_service.py'
      - 'hourly_publication_recovery.py'
      - 'pit_artifact_publication.py'
      - 'test_pit_artifact_publication.py'
      - 'publication_recovery.py'
      - 'test_hourly_publication_recovery.py'
      - 'oss_inventory_retention.py'
      - 'test_evidence_capacity_regressions.py'
      - 'archive_capture_bridge.py'
      - 'test_archive_capture_bridge.py'
      - 'p0_open_target_guard.py'
      - 'runtime_audit_worker.py'
      - 'test_runtime_audit_worker.py'
      - 'test_runtime_deadline_service.py'
      - 'test_qualified_archive_drain.py'
      - '.github/workflows/okx_hourly_extreme_history.yml'
      - '.github/workflows/runtime_deadline_tests.yml'
  push:
    branches: [main]
    paths:
      - 'runtime_deadline_service.py'
      - 'hourly_publication_recovery.py'
      - 'pit_artifact_publication.py'
      - 'test_pit_artifact_publication.py'
      - 'publication_recovery.py'
      - 'test_hourly_publication_recovery.py'
      - 'oss_inventory_retention.py'
      - 'test_evidence_capacity_regressions.py'
      - 'archive_capture_bridge.py'
      - 'test_archive_capture_bridge.py'
      - 'p0_open_target_guard.py'
      - 'runtime_audit_worker.py'
      - 'test_runtime_audit_worker.py'
      - 'test_runtime_deadline_service.py'
      - 'test_qualified_archive_drain.py'
      - '.github/workflows/runtime_deadline_tests.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5 oss2==2.19.1 aliyun-python-sdk-core==2.16.1
      - run: python -m unittest discover -q
      - run: python forward_validation_v2.py --integrity-only
