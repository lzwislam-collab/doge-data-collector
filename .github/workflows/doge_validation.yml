name: Audit DOGE predictive direction baselines
on:
  workflow_dispatch:
  schedule:
    - cron: '52 3 * * *'
permissions:
  contents: write
concurrency:
  group: doge-model-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate market regime and nonoverlap prediction baselines
        id: audit
        continue-on-error: true
        run: python doge_validate.py
      - name: Persist audit results
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/validation/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: audit DOGE prediction baseline robustness'
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 4
            done
          fi
      - name: Fail workflow if validation failed
        if: steps.audit.outcome != 'success'
        run: exit 1
